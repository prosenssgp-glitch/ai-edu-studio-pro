name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Install Android SDK platform and build tools
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug
      - name: Validate APK package and bundled quiz app
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK size in bytes:"
          stat -c '%s' "$APK"
          echo "APK package metadata:"
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging "$APK" | head -n 5
          echo "Required app asset:"
          unzip -l "$APK" | grep 'assets/index.html'
          echo "DEX bytecode:"
          unzip -l "$APK" | grep -E 'classes([0-9]*)?\.dex'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Edu-Studio-Pro-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
